# Allow-list URL catalog. HaGeZi maintainer whitelist + optional extras.
# Parsed as INI or as one URL per line. Fetched every Actions run.
#
# Put PERSONAL allow names in GitHub Secret DYNAMIC_WHITELIST (multiline),
# not in this public file, if you do not want them on a resume.

[Allow-Urls]
Hagezi-Whitelist = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/whitelist-onlydomains.txt
Hagezi-Whitelist-Referral = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/whitelist-referral-onlydomains.txt
Hagezi-Whitelist-Urlhaus = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/whitelist-urlhaus-onlydomains.txt
