# DNS-oriented block sources. Browser cosmetic lists (##, #@#) are parsed but
# skipped. HaGeZi Pro++ already overlaps heavily with EasyList / EasyPrivacy /
# uBlock — duplicates are collapsed. Threat lists (TIF) are kept first when
# the 300k DOMAIN cap is hit.
#
# Prefer HaGeZi *wildcard/onlydomains* : each line is already a parent domain,
# which matches how Cloudflare `dns.domains` works.
#
# When the DOMAIN cap is tight, [Ads-Privacy] fills slots FIRST, then [Threat].

[Threat]
# HaGeZi Threat Intelligence Feeds (malware, phishing, C2)
HaGeZi-TIF = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt

[Ads-Privacy]
# HaGeZi Pro++ (full, not mini/light) — ads, tracking, telemetry
HaGeZi-ProPlus = https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus-onlydomains.txt

# AdGuard DNS filter (DNS-safe, not the browser extension list)
AdGuard-DNS = https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt

# AdGuard Hostlists Registry — Mobile Ads
AdGuard-MobileAds = https://adguardteam.github.io/HostlistsRegistry/assets/filter_11.txt

# EasyList — ad servers only (not the full cosmetic EasyList)
EasyList-AdServers = https://raw.githubusercontent.com/easylist/easylist/master/easylist/easylist_adservers.txt

# EasyPrivacy — tracking servers
EasyPrivacy-Servers = https://raw.githubusercontent.com/easylist/easylist/master/easyprivacy/easyprivacy_trackingservers.txt

# uBlock Origin — network filters (cosmetics are skipped by the parser)
uBlock-Filters = https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt

# StevenBlack unified hosts (ads + malware baseline)
StevenBlack-Hosts = https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
